[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldsim-npc-mind"
version = "0.1.0"
description = "Per-NPC dialog generator with knowledge-bounded reasoning."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "worldsim-schemas",
    "worldsim-prompts",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/worldsim_npc_mind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
